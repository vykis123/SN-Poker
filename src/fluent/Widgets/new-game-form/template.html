<form class="form" id="form" submit="#">

        <label class="group__label" for="title">Enter Project Title:</label>
        <input type="text" class="group__input" id="title" name="title" placeholder="Title" required />
    </div>
    <button class="form__btn submit" title="Submit form data">Submit</button>
    <button class="form__btn cancel" title="Cancel form submission">Cancel</button>
</form>
